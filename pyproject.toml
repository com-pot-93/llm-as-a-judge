[tool.poetry]
name = "llm-as-a-judge"
version = "0.1.0"
description = ""
authors = ["blinded for submission"]
readme = "README.md"

[[tool.poetry.source]]
name = "sap"
url = "https://common.repositories.cloud.sap/artifactory/api/pypi/deploy-releases-hyperspace-pypi/simple"
priority = "explicit"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.11,<3.12"
sentence_transformers = "^2.2.2"
ipykernel = "^6.29.4"
python-dotenv = "^1.0.1"
datasets = "^2.18.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.4"
pandas = "^2.1.3"
openpyxl = "^3.1.2"
nltk = "^3.9.1"
sap-ai-sdk-gen = {extras = ["all"], version = "^7.2.0"}
dotenv = "^0.9.9"
aiobotocore = {version = "^3.9.2", extras = ["boto3"]}
boto3 = "1.43.106"
google = "^3.0.0"
google-genai = "^2.9.0"
langchain-aws = ">=1.6.0,<1.7.0"
langchain-google-genai = ">=4.2.5,<4.3.0"

[tool.poetry.group.dev.dependencies]

huggingface-hub = "^0.19.1"
ipython = "^8.17.2"
notebook = "^7.0.6"
matplotlib = "^3.9.2"
scipy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

